    <script>
      (function () {
        try {
          var t = localStorage.getItem('anamari-tema');
          if (t !== 'oscuro' && t !== 'claro') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          }
          if (t === 'oscuro') {
            document.documentElement.classList.add('oscuro');
            document.documentElement.style.colorScheme = 'dark';
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#1a1814');
          }
        } catch (e) {}
      })();
    </script>
