<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1814" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Mercería y arreglos de ropa en Getafe. Confort para todos los talles. Confecciones Ana Mari."
    />
    <meta
      name="keywords"
      content="mercería, arreglos de ropa, confecciones, Getafe, Ana Mari, costura, tallas grandes"
    />
    <meta name="author" content="Confecciones Ana Mari" />
    <meta name="application-name" content="Confecciones Ana Mari" />
    <meta name="robots" content="index, follow" />
    <title>Confecciones Ana Mari · Mercería y arreglos de ropa en Getafe</title>

    <!-- Favicons / iconos de pestaña y favoritos -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph (WhatsApp, Facebook, Telegram, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Confecciones Ana Mari" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Confecciones Ana Mari · Mercería y arreglos en Getafe" />
    <meta
      property="og:description"
      content="Mercería y arreglos de ropa en Getafe. Confort para todos los talles."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Mercería Ana Mari — Confort para todos los talles" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Confecciones Ana Mari · Mercería y arreglos en Getafe" />
    <meta
      name="twitter:description"
      content="Mercería y arreglos de ropa en Getafe. Confort para todos los talles."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
    <meta name="twitter:image:alt" content="Logo de Mercería Ana Mari" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('anamari-tema');
          if (t !== 'oscuro' && t !== 'claro') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          }
          if (t === 'oscuro') {
            document.documentElement.classList.add('oscuro');
            document.documentElement.style.colorScheme = 'dark';
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            metas.forEach(function (m) {
              m.setAttribute('content', '#1a1814');
            });
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preload" as="image" href="/demo/hero-coser.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
