server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml image/webp;

  # DNS interno de Docker: resuelve "api" en cada petición, así nginx no se queda
  # con una IP vieja cuando se recrea el contenedor de la API.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3001;

  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 50m;
  }

  location /subidas/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /health {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }

  location = /sitemap.xml {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
