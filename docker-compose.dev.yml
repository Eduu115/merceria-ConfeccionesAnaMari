services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anamari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anamari}
      POSTGRES_DB: ${POSTGRES_DB:-anamari}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anamari} -d ${POSTGRES_DB:-anamari}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: desarrollo
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-anamari}:${POSTGRES_PASSWORD:-anamari}@postgres:5432/${POSTGRES_DB:-anamari}
      ORIGEN_PUBLICO: http://localhost:5173
      PUERTO: "3001"
      RUTA_SUBIDAS: /app/apps/api/datos/subidas
      RUTA_COPIAS: /app/apps/api/datos/copias
    volumes:
      - ./apps/api:/app/apps/api
      - ./paquetes/compartido:/app/paquetes/compartido
      - subidas:/app/apps/api/datos/subidas
    ports:
      - "3010:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: desarrollo
    restart: unless-stopped
    environment:
      API_INTERNO: http://api:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web:/app/apps/web
      - ./paquetes/compartido:/app/paquetes/compartido
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  subidas:
