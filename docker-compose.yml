# Producción en el homelab.
# El túnel de Cloudflare lo gestiona el cloudflared instalado en el host (compartido
# con otras apps), así que aquí NO hay contenedor cloudflared. La web se publica
# solo en loopback y el túnel apunta a ella:
#   confemerana.es / www.confemerana.es  →  http://localhost:3012
# nginx (web) hace de proxy de /api, /subidas y /socket.io hacia la API.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: anamari
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: anamari
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anamari -d anamari"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: produccion
    restart: unless-stopped
    env_file: .env
    environment:
      NODO_ENTORNO: produccion
      PORT: "3001"
      DATABASE_URL: postgres://anamari:${DB_PASSWORD}@db:5432/anamari
      CORS_ORIGINS: ${CORS_ORIGINS}
      ORIGEN_PUBLICO: https://${DOMINIO}
      SERVIR_ESTATICOS: "false"
      RUTA_SUBIDAS: /app/datos/subidas
      RUTA_COPIAS: /app/datos/copias
    volumes:
      - subidas:/app/datos/subidas
      - copias:/app/datos/copias
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: produccion
      args:
        # Vacío = misma origen; nginx reenvía /api a la API.
        VITE_API_URL: ""
        VITE_SITE_URL: https://${DOMINIO}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUERTO_WEB:-3012}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  pgdata:
  subidas:
  copias:
