# Homelab: sin puertos publicados. Cloudflare Tunnel enruta al front (nginx).
# En el panel del túnel (Zero Trust → Networks → Tunnels → Public hostnames):
#   DOMINIO.com / www.DOMINIO.com  →  http://web:80
# (nginx hace proxy de /api, /subidas y /socket.io a http://api:3001)
# Opcional: api.DOMINIO.com → http://api:3001
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: anamari
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: anamari
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anamari -d anamari"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: produccion
    restart: unless-stopped
    env_file: .env
    environment:
      NODO_ENTORNO: produccion
      PORT: "3001"
      DATABASE_URL: postgres://anamari:${DB_PASSWORD}@db:5432/anamari
      CORS_ORIGINS: ${CORS_ORIGINS}
      ORIGEN_PUBLICO: https://${DOMINIO}
      SERVIR_ESTATICOS: "false"
      RUTA_SUBIDAS: /app/datos/subidas
      RUTA_COPIAS: /app/datos/copias
    volumes:
      - subidas:/app/datos/subidas
      - copias:/app/datos/copias
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: produccion
      args:
        # Vacío = misma origen (nginx hace de proxy a la API)
        VITE_API_URL: ""
        VITE_SITE_URL: https://${DOMINIO}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # http2 evita fallos intermitentes de QUIC en algunos redes domésticas
    command: tunnel --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - api
      - web

volumes:
  pgdata:
  subidas:
  copias:
