# Homelab: sin puertos publicados. El túnel de Cloudflare entra a http://api:3001.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: anamari
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: anamari
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anamari -d anamari"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: produccion
    restart: unless-stopped
    env_file: .env
    environment:
      NODO_ENTORNO: produccion
      PORT: "3001"
      DATABASE_URL: postgres://anamari:${DB_PASSWORD}@db:5432/anamari
      CORS_ORIGINS: ${CORS_ORIGINS}
      ORIGEN_PUBLICO: https://DOMINIO.com
      SERVIR_ESTATICOS: "false"
      RUTA_SUBIDAS: /app/datos/subidas
      RUTA_COPIAS: /app/datos/copias
    volumes:
      - subidas:/app/datos/subidas
      - copias:/app/datos/copias
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  pgdata:
  subidas:
  copias:
