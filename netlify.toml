# Front en Netlify. El build corre dentro de apps/web; el comando sube a la raíz
# del monorepo porque @anamari/web depende del workspace paquetes/compartido.
[build]
  base = "apps/web"
  command = "cd ../.. && npm ci && npm run build -w paquetes/compartido && npm run build -w apps/web"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
